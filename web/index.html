<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <title>Kyran — платформа для участия в госзакупках</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css?v=12">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="Навигация">
      <a class="brand" href="#feed" aria-label="Kyran">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M1 10.5c5.5-.4 9.6 1.8 13 5.6l.6-2.3c.3-1 .8-1.5 1.4-1.5s1.1.5 1.4 1.5l.6 2.3c3.4-3.8 7.5-6 13-5.6-4.6 1.6-8.2 4.6-10.6 8.8L18 23.5l-2 3-2-3-1.4-4.2C10.2 15.1 5.6 12.1 1 10.5z" fill="currentColor"/></svg>
        <span>Kyran</span>
      </a>
      <nav class="nav">
        <a href="#feed" data-tab="feed"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h9"/></svg>Закупки</a>
        <a href="#pipeline" data-tab="pipeline"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 4h4v12H3zM8 4h4v8H8zM13 4h4v5h-4z"/></svg>Заявки</a>
        <a href="#documents" data-tab="documents"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 2.5h7l3.5 3.5v11.5H5z"/><path d="M12 2.5V6h3.5M7.5 10h5M7.5 13h5"/></svg>Документы</a>
        <a href="#analyses" data-tab="analyses"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 16.5h14M5.5 13.5V9M10 13.5V5M14.5 13.5v-6"/></svg>Разборы</a>
        <a href="#profile" data-tab="profile"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="7.5" r="3.5"/><path d="M3.5 17c1.2-3.2 3.6-4.5 6.5-4.5s5.3 1.3 6.5 4.5"/></svg>Профиль</a>
      </nav>
      <a class="user-box" id="user-box" href="#profile/plan" hidden></a>
      <div class="sidebar-foot">
        <div class="status-line"><span id="src-dot" class="dot"></span><span id="src-text">Источники данных</span></div>
        <div class="status-line"><span id="ai-dot" class="dot"></span><span id="ai-text">ИИ-модуль</span></div>
      </div>
    </aside>

    <div class="main">
      <div id="demo-strip" class="notice" hidden>Демонстрационный режим: показаны вымышленные закупки. Реальные данные появятся после подключения портала госзакупок.</div>
      <main id="view" class="view" aria-live="polite"></main>
    </div>
  </div>

  <nav class="tabbar" aria-label="Разделы">
    <a href="#feed" data-tab="feed"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h9"/></svg><span>Закупки</span></a>
    <a href="#pipeline" data-tab="pipeline"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 4h4v12H3zM8 4h4v8H8zM13 4h4v5h-4z"/></svg><span>Заявки</span></a>
    <a href="#documents" data-tab="documents"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 2.5h7l3.5 3.5v11.5H5z"/><path d="M12 2.5V6h3.5M7.5 10h5M7.5 13h5"/></svg><span>Документы</span></a>
    <a href="#analyses" data-tab="analyses"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 16.5h14M5.5 13.5V9M10 13.5V5M14.5 13.5v-6"/></svg><span>Разборы</span></a>
    <a href="#profile" data-tab="profile"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="7.5" r="3.5"/><path d="M3.5 17c1.2-3.2 3.6-4.5 6.5-4.5s5.3 1.3 6.5 4.5"/></svg><span>Профиль</span></a>
  </nav>

  <div id="toast" class="toast" role="status" hidden></div>
  <script src="/static/app.js?v=12"></script>
</body>
</html>
