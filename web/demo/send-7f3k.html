<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Отправка демо</title><style>
body{font-family:system-ui,sans-serif;margin:0;background:#f4f4f5;color:#111}main{max-width:560px;margin:0 auto;padding:18px}
h1{font-size:22px}label{display:block;font-weight:700;margin:8px 0}input{width:100%;box-sizing:border-box;font-size:17px;padding:12px;border:2px solid #ddd;border-radius:12px}
.c{background:#fff;border-radius:16px;padding:16px;margin:14px 0}.c h2{margin:0 0 4px;font-size:18px}.c p{margin:4px 0;color:#555;font-size:14px}
.row{display:flex;gap:8px;margin-top:10px}a.b{flex:1;text-align:center;padding:13px;border-radius:12px;font-weight:700;text-decoration:none}
.wa{background:#1fa855;color:#fff}.dm{background:#eee;color:#111}.sent{opacity:.5}
</style></head><body><main><h1>Отправка демо-сайтов</h1>
<label for="n">Ваше имя (подставится в текст)</label><input id="n" placeholder="Например: Ерасыл">
<div id="list"></div></main><script>
const I=[{"name": "Ketchunez", "wa": "77051855529", "text": "Здравствуйте! Меня зовут [имя], делаю сайты для кафе в Актобе.\nУ вас 1 160 оценок в 2ГИС, а своего сайта нет — я сделал его сам, с вашим меню и ценами:\nhttps://kyran-production.up.railway.app/static/demo/ketchunez.html\nКлиент выбирает блюда, и готовый заказ с суммой приходит вам в WhatsApp — без звонков и «не так поняли».\nЕсли понравится: 25 000 ₸, перенесу на ваш адрес, добавлю фото блюд и ссылку в Instagram и 2ГИС. Оплата после запуска.\nКому можно показать — владельцу или управляющему?", "demo": "https://kyran-production.up.railway.app/static/demo/ketchunez.html"}, {"name": "Chiki-Chiki", "wa": "77475668350", "text": "Здравствуйте! Меня зовут [имя], делаю сайты для кафе в Актобе.\nВижу, у вас 4,9 и 1 744 оценки в 2ГИС, а онлайн-заказы идут через Chocofood — с каждого заказа уходит комиссия.\nЯ сделал вам свой сайт: клиент собирает заказ, и он приходит прямо вам в WhatsApp, без посредника:\nhttps://kyran-production.up.railway.app/static/demo/chiki.html\nМеню в демо пока примерное — пришлите фото вашего меню, и сегодня-завтра будет ваше.\nЦена 25 000 ₸ один раз, оплата после запуска. Кому можно показать — владельцу или управляющему?", "demo": "https://kyran-production.up.railway.app/static/demo/chiki.html"}, {"name": "Doner na Abaya", "wa": "77713910574", "text": "Здравствуйте! Меня зовут [имя], делаю сайты для кафе в Актобе.\nУ вас 3 435 оценок в 2ГИС — одна из самых популярных донерных города, а своего сайта нет. Я сделал демо:\nhttps://kyran-production.up.railway.app/static/demo/abaya.html\nКлиент выбирает блюда, и заказ с суммой сразу приходит вам в WhatsApp — меньше звонков и ошибок в часы пик.\nМеню в демо примерное — пришлите фото вашего, и будет ваше с вашими ценами.\nЦена 25 000 ₸ один раз, оплата после запуска. Кому можно показать — владельцу или управляющему?", "demo": "https://kyran-production.up.railway.app/static/demo/abaya.html"}, {"name": "Макебаб", "wa": "77082827880", "text": "Здравствуйте! Меня зовут [имя], делаю сайты для кафе в Актобе.\nВы работаете круглосуточно, 1 652 оценки в 2ГИС, а своего сайта нет. Я сделал демо:\nhttps://kyran-production.up.railway.app/static/demo/makebab.html\nКлиент сам собирает заказ, и он приходит вам в WhatsApp уже с суммой — особенно удобно ночью, когда на кассе один человек.\nМеню в демо примерное — пришлите фото вашего, и будет ваше.\nЦена 25 000 ₸ один раз, оплата после запуска. Кому можно показать — владельцу или управляющему?", "demo": "https://kyran-production.up.railway.app/static/demo/makebab.html"}, {"name": "Doner na Zhubanova", "wa": "77086210406", "text": "Здравствуйте! Меня зовут [имя], делаю сайты для кафе в Актобе.\nУ вас 1 089 оценок в 2ГИС и вы открыты круглосуточно, а своего сайта нет. Я сделал демо:\nhttps://kyran-production.up.railway.app/static/demo/zhubanova.html\nКлиент собирает заказ на сайте, и он приходит вам в WhatsApp уже с суммой — без звонков и путаницы.\nМеню в демо примерное — пришлите фото вашего, и будет ваше.\nЦена 25 000 ₸ один раз, оплата после запуска. Кому можно показать — владельцу или управляющему?", "demo": "https://kyran-production.up.railway.app/static/demo/zhubanova.html"}];
function render(){const n=document.getElementById('n').value.trim()||'[имя]';
document.getElementById('list').innerHTML=I.map((x,i)=>`<div class="c" id="c${i}"><h2>${x.name}</h2><p>+${x.wa}</p><div class="row">
<a class="b dm" href="${x.demo}" target="_blank">Демо</a>
<a class="b wa" target="_blank" onclick="document.getElementById('c${i}').classList.add('sent')" href="https://wa.me/${x.wa}?text=${encodeURIComponent(x.text.replace('[имя]',n))}">Открыть WhatsApp</a></div></div>`).join('')}
document.getElementById('n').addEventListener('input',render);render();
</script></body></html>
